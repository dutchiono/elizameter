; Elizameter / Status skin
; Shows agent online state + active skill. Minimal hello-world meant
; to validate WebParser JSON parsing end-to-end against
; /api/widgets/status.

[Rainmeter]
Update=5000
DynamicWindowSize=1
BackgroundMode=2
SolidColor=17,17,22,220

[Metadata]
Name=Elizameter / Status
Author=Elizameter
Version=0.0.1
License=MIT

[Variables]
ApiBaseUrl=http://127.0.0.1:31337

; ── Measures ──────────────────────────────────────────────────────────

[MeasureStatus]
Measure=WebParser
URL=#ApiBaseUrl#/api/widgets/status
RegExp=(?siU)"online":(.*),.*"agentName":"(.*)".*"activeSkill":(.*),.*"lastTurnAt":(.*),.*"trajectoryCountToday":(.*)\}
UpdateRate=12
StringIndex=0
ErrorString={"online":false,"agentName":"offline","activeSkill":null,"lastTurnAt":null,"trajectoryCountToday":0}

[MeasureOnline]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=1
Substitute="true":"ONLINE","false":"OFFLINE"

[MeasureAgentName]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=2

[MeasureActiveSkill]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=3
Substitute="null":"idle","\"":""

[MeasureTrajectoryCount]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=5

; ── Meters ────────────────────────────────────────────────────────────

[MeterTitle]
Meter=String
Text=Elizameter
FontColor=180,180,200,255
FontSize=9
FontFace=Segoe UI
StringStyle=Bold
AntiAlias=1
X=10
Y=8

[MeterAgentName]
Meter=String
MeasureName=MeasureAgentName
Text=%1
FontColor=255,255,255,255
FontSize=16
FontFace=Segoe UI
AntiAlias=1
X=10
Y=22

[MeterOnline]
Meter=String
MeasureName=MeasureOnline
Text=%1
FontColor=120,220,140,255
FontSize=9
FontFace=Segoe UI
StringStyle=Bold
AntiAlias=1
X=10
Y=54

[MeterActiveSkill]
Meter=String
MeasureName=MeasureActiveSkill
Text=skill: %1
FontColor=150,150,170,255
FontSize=9
FontFace=Segoe UI
AntiAlias=1
X=10
Y=70

[MeterTrajectoryCount]
Meter=String
MeasureName=MeasureTrajectoryCount
Text=turns today: %1
FontColor=150,150,170,255
FontSize=9
FontFace=Segoe UI
AntiAlias=1
X=10
Y=86
W=220
H=20
